<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Faculty – Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <style>
    body {
      background: radial-gradient(circle at top, #0ea5e9 0, #1d4ed8 45%, #020617 100%);
      min-height: 100vh;
      color: #f9fafb;
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background: radial-gradient(circle at top left, #1d4ed8 0, #020617 55%);
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .side-title {
      font-weight: 600;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .side-title span {
      background: #38bdf8;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #020617;
    }
    .nav-link-side {
      border-radius: 999px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: #e5e7eb;
      text-decoration: none;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }
    .nav-link-side.active {
      background: linear-gradient(to right, #38bdf8, #6366f1);
      color: #0b1020;
      font-weight: 600;
    }
    .nav-link-side:hover {
      background: rgba(148,163,184,0.18);
      text-decoration: none;
      color: #f9fafb;
    }
    .side-footer { margin-top: auto; }
    .main { flex: 1; padding: 1.8rem 2rem; }
    .dash-card {
      background: rgba(15,23,42,0.96);
      border-radius: 1.2rem;
      padding: 1.6rem 1.7rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(56,189,248,0.45);
      box-shadow: 0 20px 35px rgba(15,23,42,0.8);
    }
  </style>
</head>
<body class="faculty-theme">
<div class="layout">
  <aside class="sidebar">
    <div>
      <div class="side-title mb-1">
        <span>F</span> <div>Faculty Portal</div>
      </div>
      <div class="small text-muted">Student feedback on courses.</div>
    </div>


    <nav>
      <a href="faculty_dashboard.html" class="nav-link-side">🏠 Overview</a>
      <a href="faculty_attendance.html" class="nav-link-side">📋 Attendance</a>
      <a href="faculty_marks.html" class="nav-link-side">🧮 Marks & Grades</a>
      <a href="faculty_events.html" class="nav-link-side">🗓 Events & Calendar</a>
      <a href="faculty_projects.html" class="nav-link-side">📌 Projects</a>
      <a href="faculty_feedback.html" class="nav-link-side active">💬 Feedback</a>
      <a href="faculty_student_view.html" class="nav-link-side">🔍 Student Lookup</a>
    </nav>

    <div class="side-footer">
      <button class="nav-link-side" onclick="openChat()">💬 Chat</button>
      <button class="nav-link-side" onclick="logout()">🚪 Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="dash-card mb-4">
      <h4 class="mb-1">Feedback</h4>
      <div class="small text-secondary">
        View feedback given by students for your subjects. (Stored locally for demo.)
      </div>
    </div>

    <div class="dash-card">
      <h5 class="mb-3">Feedback Entries</h5>
      <ul id="feedbackList" class="list-group list-group-flush small"></ul>
    </div>
  </main>
</div>

<script src="assets/app.js"></script>
<script>
  const FEEDBACK_KEY = "portal_faculty_feedback";

  document.addEventListener("DOMContentLoaded", () => {
    const auth = requireAuth("faculty");
    if (!auth) return;
    renderFeedback(auth.email);
  });

  function logout() {
    localStorage.removeItem(STORAGE_AUTH_KEY);
    window.location.href = "index.html";
  }
  function openChat() {
    window.location.href = "chat.html";
  }

  function getFeedback() {
    const raw = localStorage.getItem(FEEDBACK_KEY);
    return raw ? JSON.parse(raw) : [];
  }

  function renderFeedback(facultyEmail) {
    const ul = document.getElementById("feedbackList");
    ul.innerHTML = "";
    const all = getFeedback();
    const list = all.filter(f => !facultyEmail || f.facultyEmail === facultyEmail);

    if (!list.length) {
      ul.innerHTML =
        `<li class="list-group-item bg-transparent text-secondary">
           No feedback submitted yet.
         </li>`;
      return;
    }

    list.forEach((f) => {
      const li = document.createElement("li");
      li.className = "list-group-item bg-transparent text-light";
      li.innerHTML = `
        <div class="d-flex justify-content-between">
          <div>
            <div class="fw-semibold">${f.subject || "Course"}</div>
            <div class="small text-secondary">
              From: ${f.studentName || f.studentEmail}
            </div>
          </div>
          <div class="text-end small">
            <div class="text-warning">Rating: ${f.rating || "-"} / 5</div>
          </div>
        </div>
        <div class="mt-1 small text-secondary">
          "${f.comments || ""}"
        </div>
      `;
      ul.appendChild(li);
    });
  }
</script>
</body>
</html>
