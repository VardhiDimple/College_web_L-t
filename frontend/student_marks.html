<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student – Marks</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
<div class="layout-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand"><div class="brand-logo-circle">S</div><span>Student Portal</span></div>
    <div class="sidebar-nav">
      <a href="student_dashboard.html" class="nav-link-pill"><span class="label">🏠 Overview</span></a>
      <a href="student_attendance.html" class="nav-link-pill"><span class="label">📊 Attendance</span></a>
      <a href="student_marks.html" class="nav-link-pill active"><span class="label">🧮 Marks & Grades</span></a>
      <a href="student_cgpa.html" class="nav-link-pill"><span class="label">🎓 CGPA Calculator</span></a>
      <button class="nav-link-pill mt-3" onclick="logout()"><span class="label">🚪 Logout</span></button>
    </div>
  </aside>


  <!-- Main -->
  <main class="main-pane">
    <div class="main-header">
      <div class="pill-tag mb-1">Marks</div>
      <div class="main-header-title">Marks from Faculty</div>
    </div>

    <section class="card-glass">
      <div class="table-responsive">
        <table class="table table-sm table-dark">
          <thead>
            <tr>
              <th>Subject</th>
              <th>Marks</th>
              <th>Max</th>
              <th>Grade</th>
            </tr>
          </thead>
          <tbody id="marksTable"></tbody>
        </table>
      </div>
      <div class="small text-muted">Updates instantly when faculty saves marks.</div>
    </section>
  </main>
</div>

<script src="assets/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", initMarksPage);
function logout(){ localStorage.removeItem(STORAGE_AUTH_KEY); window.location.href="index.html"; }

async function initMarksPage(){
  const tbody=document.getElementById("marksTable");
  tbody.innerHTML = "";
  const res = await fetch(API_BASE+"/marks/me",{headers:{...getAuthHeaders()}});
  const data = await res.json();

  if(!res.ok || !data.length){
    tbody.innerHTML = `<tr><td colspan="4" class="text-secondary small">No marks available yet.</td></tr>`;
    return;
  }

  data.forEach(r=>{
    const tr=document.createElement("tr");
    tr.innerHTML = `
      <td>${subjectLabel(r.subject)}</td>
      <td>${r.marks}</td>
      <td>${r.maxMarks}</td>
      <td>${r.grade}</td>
    `;
    tbody.appendChild(tr);
  });
}
</script>
</body>
</html>
