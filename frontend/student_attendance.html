<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Student – Attendance</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      background: radial-gradient(circle at top, #a855f7 0, #7c3aed 45%, #020617 100%);
      min-height: 100vh;
      color: #f9fafb;
    }
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px;
      background: radial-gradient(circle at top left, #4c1d95 0, #020617 55%);
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .side-title {
      font-weight: 600;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .side-title span {
      background: #f97316;
      width: 34px;
      height: 34px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: #020617;
    }
    .nav-link-side {
      border-radius: 999px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.25rem;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      color: #e5e7eb;
      text-decoration: none;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }
    .nav-link-side.active {
      background: linear-gradient(to right, #f97316, #fb923c);
      color: #0b1020;
      font-weight: 600;
    }
    .nav-link-side:hover {
      background: rgba(148,163,184,0.18);
      text-decoration: none;
      color: #f9fafb;
    }
    .side-footer { margin-top: auto; }
    .main { flex: 1; padding: 1.8rem 2rem; }
    .dash-card {
      background: rgba(15,23,42,0.96);
      border-radius: 1.2rem;
      padding: 1.6rem 1.7rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(233,213,255,0.45);
      box-shadow: 0 20px 35px rgba(15,23,42,0.8);
    }
  </style>
</head>
<body class="student-theme">
<div class="layout">
  <aside class="sidebar">
    <div>
      <div class="side-title mb-1">
        <span>S</span> <div>Student Portal</div>
      </div>
      <div class="small text-muted">Attendance overview.</div>
    </div>


    <nav>
      <a href="student_dashboard.html" class="nav-link-side">🏠 Overview</a>
      <a href="student_attendance.html" class="nav-link-side active">📊 Attendance</a>
      <a href="student_grades.html" class="nav-link-side">📚 Grades & CGPA</a>
      <a href="student_finance.html" class="nav-link-side">💰 Finance</a>
      <a href="student_calendar.html" class="nav-link-side">🗓 Academic Calendar</a>
      <a href="student_projects.html" class="nav-link-side">📌 Projects</a>
      <a href="student_feedback.html" class="nav-link-side">💬 Faculty Feedback</a>
      <a href="student_infra.html" class="nav-link-side">🏗 Infra Issues</a>
    </nav>

    <div class="side-footer">
      <button class="nav-link-side" onclick="openChat()">💬 Chat</button>
      <button class="nav-link-side" onclick="logout()">🚪 Logout</button>
    </div>
  </aside>

  <main class="main">
    <div class="dash-card mb-4">
      <h4 class="mb-1">Attendance</h4>
      <div class="small text-secondary">
        View your overall attendance percentage and subject-wise record.
      </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>


    <div class="row">
      <div class="col-md-5">
        <div class="dash-card">
          <h6 class="mb-3">Overall Attendance</h6>
          <canvas id="attendanceChart" height="180"></canvas>
          <div id="attSummary" class="mt-3 small"></div>
        </div>
      </div>
      <div class="col-md-7">
        <div class="dash-card">
          <h6 class="mb-3">Detailed Record</h6>
          <table class="table table-sm table-dark mb-0">
            <thead>
            <tr>
              <th>Date</th>
              <th>Subject</th>
              <th>Status</th>
            </tr>
            </thead>
            <tbody id="attTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="assets/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const auth = requireAuth("student");
    if (!auth) return;
    initAttendancePage();
  });

  function logout() {
    localStorage.removeItem(STORAGE_AUTH_KEY);
    window.location.href = "index.html";
  }
  function openChat() {
    window.location.href = "chat.html";
  }

  async function initAttendancePage() {
    const summaryEl = document.getElementById("attSummary");
    const tbody = document.getElementById("attTableBody");
    const ctx = document.getElementById("attendanceChart").getContext("2d");

    try {
      const res = await fetch(API_BASE + "/attendance/me", {
        headers: { ...getAuthHeaders() }
      });
      const records = await res.json();

      if (!res.ok) {
        summaryEl.innerHTML =
          '<span class="text-danger">Error loading attendance.</span>';
        renderPie(ctx, 0, 1);
        return;
      }

      if (!records.length) {
        summaryEl.innerHTML =
          '<span class="text-secondary">No attendance data yet. Once faculty marks attendance, it will appear here.</span>';
        renderPie(ctx, 0, 1);
        return;
      }

      const total = records.length;
      const present = records.filter(r => r.present).length;
      const absent = total - present;
      const percentage = ((present / total) * 100).toFixed(1);

      summaryEl.innerHTML = `
        <div>Total classes: <strong>${total}</strong></div>
        <div>Present: <strong>${present}</strong> | Absent: <strong>${absent}</strong></div>
        <div>Attendance %: <strong>${percentage}%</strong></div>
      `;

      // Table
      tbody.innerHTML = "";
      records.forEach(r => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${r.date}</td>
          <td>${subjectLabel(r.subject)}</td>
          <td class="${r.present ? "text-success" : "text-danger"}">
            ${r.present ? "Present" : "Absent"}
          </td>
        `;
        tbody.appendChild(tr);
      });

      renderPie(ctx, present, absent);
    } catch (err) {
      console.error(err);
      summaryEl.innerHTML =
        '<span class="text-danger">Error: ' + err.message + "</span>";
      renderPie(ctx, 0, 1);
    }
  }

  function renderPie(ctx, present, absent) {
  new Chart(ctx, {
    type: "pie",
    plugins: [ChartDataLabels], // enable % always visible
    data: {
      labels: ["Present", "Absent"],
      datasets: [
        {
          data: [present, absent],
          backgroundColor: ["#10b981", "#ef4444"], // green / red
          borderColor: "#ffffff",
          borderWidth: 2
        }
      ]
    },
    options: {
      plugins: {
        legend: {
          labels: {
            color: "#ffffff", // legend text white
            font: { size: 14 }
          }
        },
        datalabels: {
          color: "#ffffff",
          font: { weight: "bold", size: 14 },
          formatter: (value, ctx) => {
            const total = present + absent;
            if (total === 0) return "0%";
            return Math.round((value / total) * 100) + "%";
          }
        }
      }
    }
  });
}

</script>
</body>
</html>
